# =============================================================
# alembic.ini - Alembic configuration
# =============================================================
# sqlalchemy.url is intentionally EMPTY: env.py reads the real
# URL from core.config.settings so credentials never land in git.
#
# Commands (run from the api/ directory):
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "message"
#   alembic history
# =============================================================

[alembic]
script_location = alembic
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
