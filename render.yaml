# =============================================================
# render.yaml - one-click deploy blueprint for Render.com
# =============================================================
# Creates: a managed PostgreSQL, the FastAPI web service, and the
# static Vue site. After the first deploy, set CORS_ORIGINS on the
# API to the static site URL and VITE_API_URL on the site to the
# API URL (or wire them via the dashboard as shown below).
# =============================================================

databases:
  - name: rental-db
    plan: free
    databaseName: rental_db
    user: rental_user

services:
  - type: web
    name: rental-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rental-db
          property: connectionString
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: apartment-rental-management
      - key: CORS_ORIGINS
        sync: false   # set to the static site URL after first deploy

  - type: web
    name: rental-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # set to the rental-api URL after first deploy
